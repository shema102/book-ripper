[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-book-tool"
version = "0.1.0"
description = "Local webcam book capture and independently reusable OCR-to-EPUB tools"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "numpy>=1.26,<3"]

[project.optional-dependencies]
capture = ["opencv-python>=4.9,<5"]
dictionary = ["wordfreq>=3.1,<4"]

[project.scripts]
opticalbook = "opticalbook.__main__:main"

[tool.setuptools]
packages = ["opticalbook"]
